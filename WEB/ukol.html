<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body {
      background-color: #cbcbcb;
      width: auto;
      margin: auto;
      font-family:
        Work Sans,
        sans-serif;
    }
    .horni_zeleny_blok {
      background-color: #a0f1bd;
      width: auto;
      margin: auto;
      height: 40rlh;
      border-bottom-right-radius: 2rlh;
      border-bottom-left-radius: 2rlh;
    }
    nav {
      display: grid;
      grid-template-columns: auto auto auto;
      align-items: center;
      padding-top: 1rlh;
      color:#2e4f21;
    }
    .services {
      margin-left: 30rlh;
    }
    .noble-finances {
      margin-left: 2rlh;
      font-weight: bold;
    }
    .book-appointment {
      background-color: #2e4f21;
      color: white;
      padding: 1rlh;
      padding-right: -2rlh;
      border-radius: 1rlh;
    }
  </style>
  <body>
    <div class="horni_zeleny_blok">
      <nav>
        <span class="noble-finances">Noble Finances</span>
        <span class="services">Services</span>
        <span class="book-appointment">Book an appointment</span>
      </nav>
    </div>
  </body>
</html>
